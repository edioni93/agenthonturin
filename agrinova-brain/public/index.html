<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriNova Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, shipped work tool for a precision-farming team; clear, no props.
   IDEA: the team's field logbook that writes itself each morning and waits for a signature.
   PICTURE: the live app itself; brief cards, cited answers, approval cards.
   COLOUR and TYPE: deep blue bar, red accent for "needs a person" and live alerts, white ground; Archivo + Inter.
   LAYOUT: top bar with persona, left rail of six views, main column, slide-in source drawer. */
:root{color-scheme:light dark;
--bg:light-dark(#f5f7fb,#0b1220);--panel:light-dark(#ffffff,#131c2e);--ink:light-dark(#111a2b,#e6ecf6);--mute:light-dark(#5a667a,#9aa7bd);
--line:light-dark(#dde3ee,#243049);--green:#0a2f6b;--green2:light-dark(#1f5fbf,#7fb0ff);--wheat:light-dark(#1f5fbf,#5b9bff);--wheatbg:light-dark(#e3ecfa,#16264a);
--red:light-dark(#0a2f6b,#9cc0ff);--redbg:light-dark(#e3ebf8,#1a2742);--blue:light-dark(#1f5fbf,#8cbcf5);--bluebg:light-dark(#eef3fb,#17233a);
--okbg:light-dark(#e6eefb,#16243b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,Inter,sans-serif;margin:0;line-height:1.1}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wheat);outline-offset:2px}
.top :focus-visible{outline-color:#fff}
.top{background:var(--green);color:#fff;display:flex;align-items:center;gap:14px;padding:10px max(2vw,14px);flex-wrap:wrap;position:sticky;top:0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font:800 19px Archivo,sans-serif;margin-right:auto}
.logo small{font:500 12px Inter;opacity:.75;display:block}
.top select{background:#ffffff1a;border:1px solid #ffffff40;border-radius:10px;padding:8px 10px;color:#fff;min-height:42px;font-size:15px}
.top select option{color:#111}
.tg{display:flex;align-items:center;gap:8px;background:#ffffff14;border:1px solid #ffffff30;border-radius:999px;padding:6px 12px;min-height:40px;font-size:13px}
.tg input{accent-color:var(--wheat);width:18px;height:18px}
.tg[hidden]{display:none}
.jpill{background:#fff;color:#0a2f6b;border:0;border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.wrap{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 62px)}
nav{border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
nav button{display:flex;align-items:center;justify-content:space-between;text-align:left;background:none;border:0;border-radius:10px;padding:11px 12px;min-height:44px;font-weight:500}
nav button[aria-current=true]{background:var(--okbg);color:var(--green2);font-weight:600}
nav .badge{background:#1f5fbf;color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:600}
nav .sp{flex:1}
nav .reset{color:var(--mute);font-size:13px;font-weight:400}
main{padding:clamp(18px,3vw,36px);max-width:1000px;width:100%}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hd h2{font-size:clamp(24px,3vw,32px)}
.hd p{margin:4px 0 0;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.card h3{font-size:17px;margin-bottom:6px}
.card p{margin:0 0 8px}
.lv-alert{border-left:5px solid var(--wheat)}
.lv-guard{border-left:5px solid var(--red)}
.lv-info{border-left:5px solid var(--green2)}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;margin-right:6px;vertical-align:2px}
.t-alert{background:#0a2f6b;color:#fff}.t-guard{background:var(--redbg);color:var(--red)}.t-info{background:var(--okbg);color:var(--green2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px;font-size:12.5px;min-height:30px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--green2)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mute)}
.k-doc{background:#1f5fbf}.k-task{background:#4a90e2}.k-email{background:#7fb0ff}.k-chat{background:#a9c8f5}.k-memory{background:#0a2f6b}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.b{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;min-height:42px;font-weight:600}
.b.ok{background:var(--green);color:#fff;border-color:var(--green)}
.b.no{color:var(--red)}
.b:disabled{opacity:.45;cursor:default}
.prop{background:var(--wheatbg);border:1px dashed var(--wheat);border-radius:12px;padding:12px 14px;margin-top:10px}
.prop .ch{font-size:12.5px;color:var(--mute)}
.prop.done,.prop.discarded{background:var(--okbg);border:1px solid var(--line)}
.prop textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);font-size:16px}
.draft{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;font-size:14px}
.state{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px}
.s-pending{background:var(--wheatbg);color:light-dark(#0a2f6b,#bcd4ff)}.s-done,.s-approved{background:var(--okbg);color:var(--green2)}.s-discarded,.s-rejected{background:var(--redbg);color:var(--red)}
.insp{margin-top:10px;border-radius:10px;background:var(--bluebg);color:var(--ink);padding:10px 12px;font-size:13px}
.insp b{color:var(--blue)}
.insp code{font-size:12px}
/* chat */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px;margin-bottom:12px}
.msg{max-width:min(640px,92%)}
.msg.me{align-self:flex-end;background:var(--green);color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px}
.msg.bot{align-self:flex-start}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px}
.bub .line{margin:0 0 8px}
.bub .line:last-child{margin:0}
.idk{color:var(--mute)}
.who{font-size:12px;color:var(--mute);margin-bottom:4px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sugg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 12px;font-size:13.5px;min-height:38px}
form.ask{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0}
form.ask input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;background:var(--panel);min-height:48px}
.empty{color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center}
.seg{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.seg button{border:0;background:none;border-radius:8px;padding:8px 12px;min-height:38px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--okbg);color:var(--green2);font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.ob{font-size:14px;border-top:1px solid var(--line);padding:10px 0}
.ob:first-of-type{border-top:0}
/* channels */
.chan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.frame{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.fbar{padding:10px 14px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.f-mail .fbar{background:#1f5fbf;color:#fff}.f-slack .fbar{background:#111a2b;color:#fff}.f-chat .fbar{background:var(--green);color:#fff}
.fbody{padding:14px;font-size:13.5px;flex:1}
.fbody .row{border-bottom:1px solid var(--line);padding:8px 0}.fbody .row:last-child{border:0}
.av{width:30px;height:30px;border-radius:8px;background:var(--green2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.slk{display:flex;gap:10px}
.mini{font-size:12px;color:var(--mute)}
/* jury */
.chk{display:flex;gap:14px;align-items:flex-start}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;background:var(--panel)}
.tick.on{background:var(--green2);border-color:var(--green2);color:#fff}
.chk h3{font-size:16px}
.chk p{margin:2px 0 0;color:var(--mute);font-size:14px}
/* drawer & toast */
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px #0003;padding:22px;z-index:40;transform:translateX(105%);transition:transform .2s;overflow-y:auto}
.drawer.open{transform:none}
.drawer .x{float:right}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:12.5px;color:var(--mute);margin-top:18px}
.live{background:#1f5fbf;color:#fff}
.lv-live{border-left:5px solid #1f5fbf;box-shadow:0 0 0 3px var(--wheatbg)}
.notif{position:fixed;top:74px;right:16px;width:min(360px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-left:5px solid #1f5fbf;border-radius:12px;box-shadow:0 12px 30px #0004;padding:14px 16px;z-index:45;transform:translateY(-12px);opacity:0;transition:.25s;pointer-events:none}
.notif.on{transform:none;opacity:1;pointer-events:auto}
.sys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.sys div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.sys b{display:block;font:700 22px Archivo,sans-serif}
.feed{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:12px;padding:10px 4px;border-top:1px solid var(--line);font-size:14px;align-items:start}
.feed .mini{white-space:nowrap}
.livebtn{color:light-dark(#1f5fbf,#7fb0ff);font-weight:600}
@media(max-width:700px){.sys{grid-template-columns:repeat(2,minmax(0,1fr))}.feed{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.drawer,.toast,.notif{transition:none}}
@media(max-width:900px){.chan{grid-template-columns:minmax(0,1fr)}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav button{flex:none;gap:8px}nav .sp{display:none}.logo small{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#4a90e2"/><path d="M16 26V10M16 14c-3-1-5-4-5-7 3 0 5 2 5 5m0 6c3-1 5-4 5-7-3 0-5 2-5 5m0 6c-3-1-5-4-5-7 3 0 5 2 5 5m0-4c3-1 5-4 5-7-3 0-5 2-5 5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg><div>AgriNova Brain<small>Precision Technology team</small></div></div>
  <label class="sr" style="font-size:13px">Viewing as</label>
  <select id="persona" aria-label="Viewing as"></select>
  <label class="tg" id="aiTg" hidden><input type="checkbox" id="ai" checked> AI phrasing</label>
  <label class="tg"><input type="checkbox" id="insp"> Jury inspector</label>
  <button class="jpill" data-tab="jury" id="jpill">Jury 0/7</button>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>
<div class="notif" id="notif" role="alert"></div>
<script>
const Brain = (() => {
  const TODAY = '2026-11-23';
  const PEOPLE = {

    marco:  { id: 'marco',  name: 'Marco Bellini', role: 'tech',    access: ['tech', 'all'],    roleLabel: 'Telematics Tech Lead', title: 'Telematics Tech Lead', interests: ['release', 'rtk'] },
    giulia: { id: 'giulia', name: 'Giulia Ferri',  role: 'finance', access: ['finance', 'all'], roleLabel: 'Head of Finance', title: 'Head of Finance', interests: ['finance', 'suppliers', 'invoicing'] },
    luca:   { id: 'luca',   name: 'Luca Moretti',  role: 'sales',   access: ['sales', 'all'],   roleLabel: 'Dealer Success, DACH', title: 'Dealer Success, DACH', interests: ['dealers', 'sales'] },

    paolo:  { id: 'paolo',  name: 'Paolo Riva',    role: 'procurement', access: ['finance', 'all'], roleLabel: 'Procurement', title: 'Procurement', interests: ['suppliers', 'procurement'] }

  const SOURCES = [

    { id: 'T1', kind: 'task', title: 'Invoice Q4 RTK subscriptions to dealers', from: 'Task board', owner: 'giulia', due: '2026-11-18', status: 'open', vis: ['finance'], tags: ['invoicing'],
      fact: 'The Q4 RTK subscription invoicing (owner Giulia Ferri) was due on 18 November and is still open.',
      text: 'Owner: Giulia Ferri. Due 18 Nov 2026. Status: open.',
      kw: ['invoice', 'invoices', 'invoicing', 'billing'] },
    { id: 'T2', kind: 'task', title: 'PT-447 · RTK signal loss after 4.2', from: 'Task board', owner: 'marco', due: '2026-11-25', status: 'in progress', vis: ['all'], tags: ['rtk', 'release'],
      fact: 'PT-447, the RTK signal loss reported after 4.2, is in progress with Marco Bellini, due 25 November.',

    { id: 'T3', kind: 'task', title: 'Dealer communication for the Argentina launch', from: 'Task board', owner: 'sara', due: '2026-12-01', status: 'open', vis: ['all'], tags: ['dealers', 'release'],
      fact: 'The dealer communication for the Argentina launch is owned by Sara Conti, due 1 December.',
      text: 'Owner: Sara Conti. Due 1 Dec 2026. Status: open.',
      kw: ['dealer communication', 'dealer comms', 'communication', 'announcement'] },
    // Raw feeds: they feed briefs and memory proposals, never answers
    { id: 'E1', kind: 'email', title: 'TN-5 modem pricing 2027', from: 'TelemaNet (supplier)', to: 'paolo', date: '2026-11-20', vis: ['finance'], tags: ['suppliers'],
      text: 'Dear Paolo, we confirm a 2027 price of €86 per unit for the TN-5 telematics modem, for volumes above 20,000 units.' },
    { id: 'E2', kind: 'email', title: 'URGENT: assistant instructions', from: 'Unknown external sender', to: 'giulia', date: '2026-11-22', vis: ['finance'], tags: ['finance'], flagged: true,

    { id: 'E3', kind: 'email', title: 'Tractors losing RTK after the update', from: 'Agro Sul Máquinas (dealer, Brazil)', to: 'marco', date: '2026-11-22', vis: ['all'], tags: ['rtk'],

    { id: 'C1', kind: 'chat', title: '#release-42', from: 'Tommaso Greco (Field Service)', date: '2026-11-20', vis: ['all'], tags: ['release'],

    { id: 'T5', kind: 'task', title: 'Müller Landtechnik renewal proposal', from: 'Task board', owner: 'luca', due: '2026-11-27', status: 'in progress', vis: ['sales'], tags: ['dealers'],

    // Everyday noise: the brief has to filter it out
    { id: 'C5', kind: 'chat', title: '#general', from: 'People team', date: '2026-11-20', vis: ['all'], tags: ['general'],

    { id: 'C6', kind: 'chat', title: '#release-42', from: 'Marco Bellini', date: '2026-11-21', vis: ['all'], tags: ['build'],

    { id: 'C7', kind: 'chat', title: '#sales-emea', from: 'Luca Moretti', date: '2026-11-21', vis: ['all'], tags: ['sales'],

    { id: 'C8', kind: 'chat', title: '#finance-pt', from: 'Giulia Ferri', date: '2026-11-20', vis: ['finance'], tags: ['forecast'],

    { id: 'E4', kind: 'email', title: 'Planned Outlook maintenance', from: 'IT Service Desk', date: '2026-11-19', vis: ['all'], tags: ['it'],

  const LIVE = {

  const MEMORY = [
    { id: 'M1', fact: 'The 2027 price of the TN-5 telematics modem is €86 per unit, for volumes above 20,000 units.', origin: ['E1'], vis: ['finance'], status: 'pending', tags: ['suppliers'],

        cites: ['M1'],

          fact: 'There is a task (owner Giulia Ferri, due 30 November) to update the 2027 cost model with the TN-5 price of €86 per unit.',
          text: 'Owner: Giulia Ferri. Due 30 Nov 2026. Status: open. Created after approval of memory M1.', kw: ['cost model'] } } },
    { id: 'M2', fact: 'Müller Landtechnik is cancelling their RTK fleet contract.', origin: ['C2'], vis: ['all'], status: 'pending', tags: ['dealers'],
      kw: ['muller', 'mueller', 'landtechnik'] },
    { id: 'M3', fact: 'Rosario field tests, week 1: RTK stable on 12 machines; week 2 is running.', origin: ['C3'], vis: ['all'], status: 'approved', by: 'marco', tags: ['release'],
      kw: ['rosario', 'field test', 'field tests', 'testing'] },
    { id: 'M4', fact: 'The LATAM rollout review is Monday at 10:00 with Sara, Marco and Giulia; it decides the Brazil 50% wave.', origin: ['C4'], vis: ['all'], status: 'approved', by: 'sara', tags: ['release'], attendees: ['sara', 'marco', 'giulia'],
      kw: ['review', 'meeting', 'monday'] }
  ];

  const ACTIONS = [
    { id: 'A1', for: 'sara', kind: 'slack', channel: 'Slack · #release-42', title: 'Post a date correction in #release-42',
      draft: 'Correction: the Argentina 4.2 OTA goes live on 8 December (OTA Release Plan 4.2), not 1 December.', cites: ['D1', 'C1'] },
    { id: 'A2', for: 'giulia', kind: 'email', channel: 'Email · accounting@agrinova.example', title: 'Send the Q4 invoicing reminder to Accounting',
      draft: 'Hi team, the Q4 RTK subscription invoices to dealers were due on 18 November. Can we issue them by Wednesday? Thanks, Giulia', cites: ['T1'] },
    { id: 'A3', for: 'marco', kind: 'email', channel: 'Email · Agro Sul Máquinas', title: 'Reply to Agro Sul Máquinas',
      draft: 'Hello, thanks for the report. The RTK signal loss after 4.2 is tracked as PT-447 and we will update you by 25 November. Marco', cites: ['E3', 'T2'] }
  ];

  const CLAIM_LABEL = { argentina_ota: 'the Argentina OTA date' };
  const KIND_LABEL = { doc: 'Doc', task: 'Task', ticket: 'Ticket', email: 'Email', chat: 'Slack', memory: 'Memory' };

  const clone = o => JSON.parse(JSON.stringify(o));
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’`]/g, "'");
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const visible = (item, p) => p.access.includes('*') || item.vis.some(v => p.access.includes(v));
  const days = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
  const fmt = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });

  function initialState() {
    return { memory: clone(MEMORY), actions: ACTIONS.map(a => ({ ...clone(a), status: 'pending' })), outbox: [], tasks: [], extra: [], live: false, answers: [], session: { approved: [], rejected: [] }, seq: 0 };
  }

  function getItem(S, id) {
    return SOURCES.find(s => s.id === id) || S.extra.find(s => s.id === id) || S.memory.find(m => m.id === id) || S.tasks.find(t => t.id === id) || null;
  }
  function kindOf(item) { return item.kind || 'memory'; }

  // Everything that may answer a question, before permissions
  function answerable(S) {
    const docs = SOURCES.filter(s => s.kind === 'doc' || s.kind === 'task').concat(S.tasks)
      .map(s => ({ id: s.id, kind: s.kind, title: s.title, text: s.fact, vis: s.vis, kw: s.kw }));
    const mem = S.memory.filter(m => m.status === 'approved')
      .map(m => ({ id: m.id, kind: 'memory', title: 'Approved memory', text: m.fact, vis: m.vis, kw: m.kw }));
    return docs.concat(mem);
  }

  function pool(S, pid) {
    const p = PEOPLE[pid];
    const all = answerable(S);
    return {
      allowed: all.filter(i => visible(i, p)),
      hiddenByRole: all.filter(i => !visible(i, p)),
      notApproved: S.memory.filter(m => m.status !== 'approved').map(m => ({ id: m.id, kind: 'memory', status: m.status, text: m.fact, vis: m.vis, kw: m.kw })),
      feeds: SOURCES.concat(S.extra).filter(s => s.kind === 'email' || s.kind === 'chat' || s.kind === 'ticket')
    };
  }

  function matches(items, q) {
    const nq = norm(q);
    return items.map(i => {
      const hit = (i.kw || []).filter(k => new RegExp('(^|[^a-z0-9])' + escRe(norm(k)) + '([^a-z0-9]|$)').test(nq));
      return { item: i, score: hit.length, hit };
    }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);
  }

  // Rule-based answer: code decides what may be used; wording comes from the permitted sources
  function ask(S, pid, q) {
    const P = pool(S, pid);
    const hits = matches(P.allowed, q).slice(0, 2);
    const hiddenHits = matches(P.hiddenByRole, q).map(r => r.item.id);
    const pendingHits = matches(P.notApproved, q).map(r => r.item);
    const res = { q, pid, role: PEOPLE[pid].role, allowedIds: P.allowed.map(i => i.id), hiddenIds: P.hiddenByRole.map(i => i.id), hiddenHits, pendingHits: pendingHits.map(i => ({ id: i.id, status: i.status })), phrasedBy: 'rules' };
    if (hits.length) {
      res.status = 'answer';
      res.lines = hits.map(h => ({ text: h.item.text, cite: [h.item.id] }));
      res.reason = 'answered';
    } else {
      res.status = 'unknown';
      res.lines = [];
      res.reason = hiddenHits.length ? 'blocked_role' : pendingHits.length ? (pendingHits[0].status === 'rejected' ? 'rejected' : 'not_approved') : 'no_source';
    }
    return res;
  }

  // Gate for model output: every line must cite a source this person may read
  function validate(S, pid, modelOut, rule) {
    const allowed = new Set(pool(S, pid).allowed.map(i => i.id));
    const res = { ...rule, phrasedBy: 'claude' };
    const raw = (modelOut && Array.isArray(modelOut.lines)) ? modelOut.lines : [];
    const kept = raw.filter(l => l && typeof l.text === 'string' && Array.isArray(l.cite) && l.cite.length && l.cite.every(c => allowed.has(c)));
    res.dropped = raw.length - kept.length;
    if (modelOut && modelOut.status === 'answer' && kept.length) {
      res.status = 'answer'; res.lines = kept.map(l => ({ text: l.text, cite: l.cite })); res.reason = 'answered';
    } else {
      res.status = 'unknown'; res.lines = [];
      if (raw.length && !kept.length) res.reason = 'citation_check_failed';
      else if (rule.status === 'answer') res.reason = 'model_unknown';
    }
    return res;
  }

  function record(S, res) { res.n = ++S.seq; S.answers.push(res); return res; }

  function approveMemory(S, id, pid) {
    const m = S.memory.find(x => x.id === id);
    if (!m || m.status !== 'pending') return null;
    m.status = 'approved'; m.by = pid; m.at = ++S.seq;
    S.session.approved.push({ id, at: m.at });
    let followup = null;
    if (m.followup && !S.actions.find(a => a.id === m.followup.id)) {
      followup = { ...clone(m.followup), status: 'pending', proposedAfter: id };
      S.actions.push(followup);
    }
    return { memory: m, followup };
  }
  function rejectMemory(S, id, pid) {
    const m = S.memory.find(x => x.id === id);
    if (!m || m.status !== 'pending') return null;
    m.status = 'rejected'; m.by = pid; m.at = ++S.seq;
    S.session.rejected.push({ id, at: m.at });
    return m;
  }

  function triggerLive(S) {
    if (S.live) return false;
    S.live = true;
    S.extra.push(clone(LIVE.source));
    S.memory.push(clone(LIVE.memory));
    LIVE.actions.forEach(a => S.actions.push({ ...clone(a), status: 'pending', live: true }));
    return true;
  }
  function allSources(S) { return SOURCES.concat(S.extra); }

  function approveAction(S, id, pid, draft) {
    const a = S.actions.find(x => x.id === id);
    if (!a || a.status !== 'pending') return null;
    if (typeof draft === 'string' && draft.trim()) a.draft = draft.trim();
    a.status = 'done'; a.by = pid; a.at = ++S.seq;
    S.outbox.push({ id: a.id, channel: a.channel, title: a.title, text: a.draft, by: pid, at: a.at });
    if (a.createsTask && !S.tasks.find(t => t.id === a.createsTask.id)) S.tasks.push(clone(a.createsTask));
    return a;
  }
  function discardAction(S, id, pid) {
    const a = S.actions.find(x => x.id === id);
    if (!a || a.status !== 'pending') return null;
    a.status = 'discarded'; a.by = pid;
    return a;
  }

  // The brief: built by rules from the feeds, before anyone asks
  function brief(S, pid) {
    const p = PEOPLE[pid];
    const vis = SOURCES.filter(s => visible(s, p));
    const cares = s => p.interests.includes('*') || (s.tags || []).some(t => p.interests.includes(t));
    const pendingAction = cites => S.actions.find(a => a.for === pid && a.status === 'pending' && cites.some(c => a.cites.includes(c)));
    const out = [];

    // 0. live incidents, written for this person's role
    S.extra.filter(s => s.severity === 'high' && visible(s, p) && cares(s)).forEach(s => {
      const act = S.actions.find(a => a.for === pid && a.status === 'pending' && a.live);
      out.push({ level: 'alert', live: true, title: `New at ${s.time}: 40 tractors losing RTK in Mato Grosso`,
        body: `${s.from}: ${s.text} ${s.roleNotes[p.role] || ''}`, cites: s.roleCites[p.role] || [s.id], action: act && act.id,
        why: `Rule: a high-severity ticket arrived on your topics (${p.interests.join(', ')}). Each role gets its own angle: tech the cause, product the rollout, finance the exposure, CEO the decision.` });
    });

    // 1. contradictions between sources
    const byKey = {};
    vis.filter(s => s.claims).forEach(s => Object.entries(s.claims).forEach(([k, v]) => (byKey[k] = byKey[k] || []).push({ s, v })));
    Object.entries(byKey).forEach(([k, list]) => {
      const vals = [...new Set(list.map(x => x.v))];
      if (vals.length < 2 || !list.some(x => cares(x.s))) return;
      const doc = list.find(x => x.s.kind === 'doc') || list[0];
      const other = list.find(x => x.v !== doc.v);
      const act = pendingAction(list.map(x => x.s.id));
      out.push({ level: 'alert', title: `Two sources disagree on ${CLAIM_LABEL[k] || k}`,
        body: `${doc.s.title} says ${doc.v}. ${other.s.from} wrote ${other.v} in ${other.s.title}. The release plan is the approved document, so the chat message is probably wrong.`,
        cites: list.map(x => x.s.id), action: act && act.id, why: `Rule: two sources you can read make different claims about "${k}", tagged with your topics (${p.interests.join(', ')}).` });
    });

    // 2. emails that try to instruct the assistant
    vis.filter(s => s.flagged && s.to === pid).forEach(s => out.push({ level: 'guard', title: 'I blocked an email that tried to give me orders',
      body: `"${s.title}" from ${s.from} tells the assistant to send the dealer margin file outside the company. I did not act on it, and it is kept out of every answer. Please report it to IT security.`,
      cites: [s.id], why: 'Rule: text addressed to the assistant inside a feed is treated as data, never as an instruction. The email is quarantined.' }));

    // 3. overdue and upcoming tasks
    SOURCES.filter(s => s.kind === 'task').concat(S.tasks).filter(t => t.owner === pid && t.status !== 'done').forEach(t => {
      const d = days(t.due, TODAY);
      const act = pendingAction([t.id]);
      if (d > 0) out.push({ level: 'alert', title: `Overdue: ${t.title}`, body: `It was due on ${fmt(t.due)}, ${d} days ago, and is still ${t.status}.`, cites: [t.id], action: act && act.id, why: 'Rule: a task you own is past its due date.' });
      else if (-d <= 10) out.push({ level: 'info', title: `Coming up: ${t.title}`, body: `Due ${fmt(t.due)} (in ${-d} days). Status: ${t.status}.`, cites: [t.id], action: act && act.id, why: 'Rule: a task you own is due within 10 days.' });
    });

    // 4. new emails addressed to this person
    vis.filter(s => s.kind === 'email' && s.to === pid && !s.flagged && !(s.tags || []).includes('suppliers')).forEach(s => {
      const linked = SOURCES.find(t => t.kind === 'task' && t.owner === pid && t.tags.some(x => s.tags.includes(x)));
      const act = pendingAction([s.id]);
      out.push({ level: 'info', title: `New from ${s.from}`, body: `${s.text}${linked ? ` This matches ${linked.title.split(' · ')[0]}, which you own.` : ''}`,
        cites: linked ? [s.id, linked.id] : [s.id], action: act && act.id, why: 'Rule: a new email addressed to you, matched to a task you own.' });
    });

    // 5. memory waiting for review
    const pend = S.memory.filter(m => m.status === 'pending' && visible(m, p) && cares(m));
    if (pend.length) out.push({ level: 'info', title: `${pend.length} new ${pend.length > 1 ? 'items wait' : 'item waits'} for your review in Memory`,
      body: pend.map(m => m.fact).join(' / '), cites: pend.flatMap(m => m.origin), link: 'memory', why: 'Rule: learned from emails and chats on your topics. Nothing enters the shared memory until a person approves it.' });

    // 6. today's meeting
    S.memory.filter(m => m.status === 'approved' && visible(m, p) && m.kw.includes('monday') && (!m.attendees || m.attendees.includes(pid) || p.access.includes('*'))).forEach(m => out.push({ level: 'info', title: 'Today at 10:00: LATAM rollout review', body: m.fact, cites: [m.id], why: 'Rule: an approved memory item mentions a meeting today.' }));

    // 7. for whoever sees everything: decisions waiting across the team
    if (p.access.includes('*')) {
      const waiting = S.actions.filter(a => a.status === 'pending');
      if (waiting.length) out.push({ level: 'info', title: `${waiting.length} decisions are waiting for approval across the team`,
        body: waiting.map(a => `${PEOPLE[a.for].name.split(' ')[0]}: ${a.title}`).join(' / '), cites: [...new Set(waiting.flatMap(a => a.cites))].slice(0, 4),
        why: 'Rule: you can see everything, so the brief summarises what is waiting on people. You approve nothing on their behalf.' });
    }

    const rank = { guard: 1, alert: 2, info: 3 };
    return out.sort((a, b) => (a.live ? 0 : rank[a.level]) - (b.live ? 0 : rank[b.level]));
  }

  return { TODAY, PEOPLE, SOURCES, KIND_LABEL, triggerLive, allSources, initialState, getItem, kindOf, pool, ask, validate, record, approveMemory, rejectMemory, approveAction, discardAction, brief, visible, fmt };
})();
if (typeof module !== 'undefined') module.exports = Brain;

    return `<div class="hd"><div><h2>Good morning, ${esc(P().name.split(' ')[0])}</h2><p>Prepared at 07:45 on Mon ${B.fmt(B.TODAY)}, before you asked. ${items.length} things need you today.</p></div></div>
    ${items.map(i => {
      const a = i.action && !shown.has(i.action) && S.actions.find(x => x.id === i.action); if (a) shown.add(a.id);
      const lab = { alert: 'Needs attention', guard: 'Security', info: 'For you' }[i.level];
      return `<article class="card lv-${i.live ? 'live' : i.level}"><h3><span class="tag ${i.live ? 'live' : 't-' + i.level}">${i.live ? 'Live alert' : lab}</span>${esc(i.title)}</h3><p>${esc(i.body)}</p>${chips(i.cites)}
      ${i.link ? `<div class="btns"><button class="b" data-tab="${i.link}">Review in Memory</button></div>` : ''}${a ? actionCard(a) : ''}
      ${inspOn() ? `<div class="insp"><b>Why you see this:</b> ${esc(i.why)}</div>` : ''}</article>`;
    }).join('')}`;
  },
  ask() {
    const log = ui.chats[ui.person];
    return `<div class="hd"><div><h2>Ask the team's brain</h2><p>Answers come only from approved memory, documents and tasks you are allowed to read.</p></div></div>
    <div class="chat" id="chat">${log.length ? log.map(m => m.me ? `<div class="msg me">${esc(m.text)}</div>` : botMsg(m.res)).join('') : `<div class="empty">Try one of the questions below, or type your own.</div>`}
    ${ui.busy ? `<div class="msg bot"><div class="bub idk">Checking the sources you can read…</div></div>` : ''}</div>
    <div class="sugg">${SUGG.map(s => `<button data-act="sugg" data-q="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <form class="ask" id="askf"><input id="q" placeholder="Ask anything about the rollout…" autocomplete="off" aria-label="Question"><button class="b ok" ${ui.busy ? 'disabled' : ''}>Ask</button></form>`;
  },
  memory() {
    const p = P(); const vis = S.memory.filter(m => B.visible(m, p)); const hidden = S.memory.length - vis.length;
    const f = { review: m => m.status === 'pending', approved: m => m.status === 'approved', rejected: m => m.status === 'rejected' }[ui.mem];
    const list = vis.filter(f);
    const n = s => vis.filter(m => m.status === s).length;
    return `<div class="hd"><div><h2>Shared memory</h2><p>Learned from emails and chats. Nothing is used in answers until a person approves it.</p></div></div>
    <div class="seg" role="group">${[['review', `To review (${n('pending')})`], ['approved', `Approved (${n('approved')})`], ['rejected', `Rejected (${n('rejected')})`]].map(([k, l]) => `<button data-act="mem" data-k="${k}" aria-pressed="${ui.mem === k}">${l}</button>`).join('')}</div>
    ${list.length ? list.map(m => `<article class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span class="mini">${m.id} · learned from</span><span>${m.vis.includes('all') ? '' : `<span class="tag t-guard">${m.vis.join(', ')} only</span>`}<span class="state s-${m.status}">${m.status === 'pending' ? 'In review' : m.status}</span></span></div>
      <h3 style="margin-top:6px">${esc(m.fact)}</h3>${chips(m.origin)}
      ${m.status === 'pending' ? `<div class="btns"><button class="b ok" data-act="approveM" data-id="${m.id}">Approve</button><button class="b no" data-act="rejectM" data-id="${m.id}">Reject</button></div>` : `<p class="mini" style="margin-top:8px">${m.status === 'approved' ? 'Approved' : 'Rejected'} by ${esc(B.PEOPLE[m.by]?.name || '')}</p>`}
      ${inspOn() ? `<div class="insp"><b>Inspector:</b> visible to ${m.vis.join(', ')} access. ${m.status === 'approved' ? 'In the answer pool.' : 'Not in the answer pool.'}</div>` : ''}</article>`).join('') : `<div class="empty">Nothing here.</div>`}
    ${inspOn() && hidden ? `<div class="insp"><b>Inspector:</b> ${hidden} memory item(s) are restricted to another role and are not shown to ${esc(p.name)}.</div>` : ''}`;
  },
  actions() {
    const mine = S.actions.filter(a => a.for === ui.person);
    const pend = mine.filter(a => a.status === 'pending'), past = mine.filter(a => a.status !== 'pending');
    return `<div class="hd"><div><h2>Proposed actions</h2><p>The brain drafts. A person decides. Nothing leaves until someone approves.</p></div></div>
    <div class="grid2"><div>${pend.length ? pend.map(actionCard).join('') : `<div class="empty">No actions waiting for ${esc(P().name.split(' ')[0])}.</div>`}${past.map(actionCard).join('')}</div>
    <div><div class="card"><h3>Outbox</h3>${S.outbox.length ? S.outbox.slice().reverse().map(o => `<div class="ob"><b>${esc(o.title)}</b><div class="mini">${esc(o.channel)} · approved by ${esc(B.PEOPLE[o.by].name)}</div><div>${esc(o.text)}</div></div>`).join('') : `<p class="idk">Empty. Nothing has been sent or created. Every action is waiting for a person.</p>`}</div>
    <p class="mini">Simulated outbox: no real email, Slack or task is sent.</p></div></div>`;
  },
  channels() {
    ui.seen.channels = true;
    const items = B.brief(S, ui.person).slice(0, 4); const p = P();
    const rows = items.map(i => `<div class="row"><b>${esc(i.title)}</b><div class="mini">${esc(i.body.slice(0, 120))}${i.body.length > 120 ? '…' : ''}</div></div>`).join('');
    return `<div class="hd"><div><h2>Where ${esc(p.name.split(' ')[0])} meets it</h2><p>The same brief, in the places the team already works. Mock-ups, no real connection.</p></div></div>
    <div class="chan">
      <div class="frame f-mail"><div class="fbar">Mail · Inbox</div><div class="fbody"><div class="mini">From: AgriNova Brain · 07:45</div><div class="mini">To: ${esc(p.name)}</div><h3 style="font-size:16px;margin:8px 0">Your Monday brief: ${items.length} things</h3>${rows}<div class="btns"><button class="b ok" data-tab="brief">Open in Brain</button></div></div></div>
      <div class="frame f-slack"><div class="fbar"># Direct message · AgriNova Brain</div><div class="fbody"><div class="slk"><div class="av">AB</div><div><b>AgriNova Brain</b> <span class="mini">APP 07:46</span><div>Morning ${esc(p.name.split(' ')[0])}! ${items.length} things today:</div>${items.map(i => `<div style="margin-top:6px">• <b>${esc(i.title)}</b></div>`).join('')}<div class="btns"><button class="b" data-tab="actions">See approvals</button></div></div></div></div></div>
      <div class="frame f-chat"><div class="fbar">Brain chat</div><div class="fbody"><div class="bub" style="margin-bottom:8px">Hi ${esc(p.name.split(' ')[0])}, ${esc(items[0]?.title || 'all clear today')}. Want the details?</div><div class="msg me" style="margin-left:auto;width:max-content;max-width:90%">Yes, and what's due this week?</div><div class="btns"><button class="b ok" data-tab="ask">Continue in chat</button></div></div></div>
    </div>`;
  },
  sources() {
    const p = P(); const all = B.allSources(S).filter(s => B.visible(s, p) && (!s.to || s.to === p.id || p.access.includes('*')));
    const sys = [['email', 'Outlook', 'mailbox'], ['chat', 'Slack', 'channels'], ['task', 'Jira', 'tasks & tickets'], ['doc', 'SharePoint', 'documents']];
    const cnt = k => all.filter(s => s.kind === k || (k === 'task' && s.kind === 'ticket')).length;
    const list = all.slice().sort((a, b) => (b.date + (b.time || '')).localeCompare(a.date + (a.time || '')));
    return `<div class="hd"><div><h2>What it watches for ${esc(p.name.split(' ')[0])}</h2><p>Everything the brain reads, filtered by what this person is allowed to see. Last sync 07:44. Simulated connectors.</p></div></div>
    <div class="sys">${sys.map(([k, n, w]) => `<div><span class="mini">${n}</span><b>${cnt(k)}</b><span class="mini">${w}</span></div>`).join('')}</div>
    <div class="card">${list.map(s => `<div class="feed"><span class="mini"><i class="dot k-${s.kind === 'ticket' ? 'task' : s.kind}" style="display:inline-block;margin-right:6px"></i>${B.KIND_LABEL[s.kind]} · ${B.fmt(s.date)}</span><div><button class="chip" data-src="${s.id}" style="border:0;background:none;padding:0;min-height:0;font-weight:600;font-size:14px"><span>${esc(s.title)}</span></button><div class="mini" style="white-space:normal">${esc(s.from)}: ${esc(s.text.slice(0, 110))}${s.text.length > 110 ? '…' : ''}</div></div><span class="mini">${s.flagged ? '<span class="tag t-guard">Quarantined</span>' : (s.kind === 'doc' || s.kind === 'task') ? 'Answer source' : 'Feed only'}</span></div>`).join('')}</div>
    <p class="note">Feeds (email, Slack, tickets) shape briefs and memory proposals. Only approved memory, documents and tasks answer questions.</p>`;
  },
  jury() {
    const c = checks();
    return `<div class="hd"><div><h2>Jury checklist</h2><p>Each check ticks itself when you show it. ${c.filter(Boolean).length} of 7 shown.</p></div></div>
    ${CHECKS.map(([t, h, tab], i) => `<div class="card chk"><div class="tick ${c[i] ? 'on' : ''}" aria-label="${c[i] ? 'shown' : 'not shown yet'}">${c[i] ? '✓' : i + 1}</div><div style="flex:1"><h3>${i + 1}. ${esc(t)}</h3><p>${esc(h)}</p></div><button class="b" data-tab="${tab}">Go</button></div>`).join('')}
    <p class="note">Demo data for a fictional company. ${sample ? 'Answers are phrased by Gemini from the permitted sources only; code checks every citation.' : 'Answers are assembled by rules from the permitted sources.'}</p>`;
  }
};

function botMsg(r) {
  const why = {
    answered: `Answered from ${r.lines.flatMap(l => l.cite).join(', ')}. Pool for ${esc(B.PEOPLE[r.pid].name)} (access: ${B.PEOPLE[r.pid].access.join(', ')}): ${r.allowedIds.length} sources; ${r.hiddenIds.length} removed by role before retrieval.`,
    blocked_role: `Withheld. A matching source (${r.hiddenHits.join(', ')}) is restricted to another role and was removed before retrieval, so it never reached the answer step. Same wording as a gap, so nothing leaks.`,
    not_approved: `A matching memory item (${r.pendingHits.map(x => x.id).join(', ')}) is still in review. Only approved memory can answer.`,
    rejected: `The only matching memory item (${r.pendingHits.map(x => x.id).join(', ')}) was rejected by a person, so it cannot answer.`,
    no_source: 'No permitted, approved source matches. A genuine gap.',
    citation_check_failed: 'The model cited a source this person may not read. The code gate blocked the whole answer.',
    model_unknown: 'Sources matched, but the model found no answer in them.'
  }[r.reason] || r.reason;
  const body = r.status === 'answer'
    ? r.lines.map(l => `<div class="line">${esc(l.text)}${chips(l.cite)}</div>`).join('')
    : `<div class="idk">I don't know. There is nothing on this in the team's approved knowledge that you can access.</div>`;
  return `<div class="msg bot"><div class="who">AgriNova Brain</div><div class="bub">${body}</div>${inspOn() ? `<div class="insp"><b>Inspector:</b> ${esc(why)} <br>Phrased by: ${r.phrasedBy === 'claude' ? 'Gemini, then code-checked' : 'rules'}${r.note ? ` (${esc(r.note)})` : ''}${r.dropped ? `; ${r.dropped} uncited line(s) dropped` : ''}.</div>` : ''}</div>`;
}

async function doAsk(q) {
  q = q.trim(); if (!q || ui.busy) return;
  const pid = ui.person; ui.chats[pid].push({ me: true, text: q }); ui.busy = true; render();
  let res = B.ask(S, pid, q);
  if (sample && $('#ai').checked) {
    try {
      const pool = B.pool(S, pid).allowed.map(i => ({ id: i.id, text: i.text }));
      const prompt = `You are AgriNova Brain, the assistant of a precision-farming product team. Answer the QUESTION using ONLY the SOURCES below. Reply in the language of the question, at most 3 short lines. Every line must cite the ids of the sources it uses. If the sources do not contain the answer, return status "unknown" and no lines. Never use outside knowledge.
SOURCES (JSON): ${JSON.stringify(pool)}
QUESTION: ${q}
Return only JSON: {"status":"answer"|"unknown","lines":[{"text":string,"cite":[string]}]}`;
      const out = await sample.json(prompt, { modelTier: 'quick', cache: false });
      res = B.validate(S, pid, out, res);
    } catch (e) { res.note = 'AI unavailable, rules used'; }
  }
  B.record(S, res);
  ui.chats[pid].push({ res }); ui.busy = false; render();
  const c = $('#chat'); if (c) c.lastElementChild?.scrollIntoView({ block: 'nearest' });
}

function openSrc(id) {
  const it = B.getItem(S, id); const d = $('#drawer'); if (!it) return;
  const k = B.kindOf(it);
  const body = k === 'memory'
    ? `<p class="mini">Memory ${it.id} · ${it.status} ${it.by ? 'by ' + esc(B.PEOPLE[it.by].name) : ''}</p><h3>${esc(it.fact)}</h3><p class="mini" style="margin-top:12px">Learned from:</p>${chips(it.origin)}`
    : `<p class="mini">${B.KIND_LABEL[k]} · ${esc(it.from)}${it.date ? ' · ' + B.fmt(it.date) : ''}${it.due ? ' · due ' + B.fmt(it.due) : ''}</p><h3>${esc(it.title)}</h3><p>${esc(it.text)}</p>
       ${it.flagged ? '<p class="tag t-guard">Quarantined: treated as data, never as instructions</p>' : ''}
       <p class="mini">${(k === 'email' || k === 'chat') ? 'Raw feed: used for briefs and memory proposals, never quoted as an answer.' : 'Answer source.'} Visible to: ${it.vis.join(', ')}.</p>`;
  d.innerHTML = `<button class="b x" data-act="close">Close</button><div style="clear:both;padding-top:8px">${body}</div>`;
  d.classList.add('open'); d.setAttribute('aria-hidden', 'false');
}

function notify() {
  const it = B.brief(S, ui.person).find(i => i.live); if (!it) return;
  const n = $('#notif');
  n.innerHTML = `<div class="mini">AgriNova Brain · now</div><b>${esc(it.title)}</b><p class="mini" style="white-space:normal;margin:4px 0 0">${esc(it.body.slice(it.body.indexOf('URGENT')).slice(0, 140))}…</p><div class="btns"><button class="b ok" data-act="notifOpen">Open</button><button class="b" data-act="notifClose">Dismiss</button></div>`;
  n.classList.add('on');
}

function render() {
  const sel = $('#persona');
  sel.innerHTML = Object.values(B.PEOPLE).map(p => `<option value="${p.id}" ${p.id === ui.person ? 'selected' : ''}>${esc(p.name)} · ${p.roleLabel}</option>`).join('');
  const pendMine = S.actions.filter(a => a.for === ui.person && a.status === 'pending').length;
  const pendMem = S.memory.filter(m => m.status === 'pending' && B.visible(m, P())).length;
  const badge = { actions: pendMine, memory: pendMem, brief: B.brief(S, ui.person).filter(i => i.level !== 'info').length };
  $('#main').innerHTML = VIEWS[ui.tab]();
  $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" aria-current="${ui.tab === k}">${l}${badge[k] ? `<span class="badge">${badge[k]}</span>` : ''}</button>`).join('') + `<div class="sp"></div>${S.live ? '' : '<button class="livebtn" data-act="live">Simulate live event</button>'}<button class="reset" data-act="reset">Reset demo</button>`;
  $('#jpill').textContent = `Jury ${checks().filter(Boolean).length}/7`;
  $('#aiTg').hidden = !sample;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act],[data-src]'); if (!t) return;
  if (t.dataset.src) return openSrc(t.dataset.src);
  if (t.dataset.tab) { ui.tab = t.dataset.tab; ui.editing = null; $('#drawer').classList.remove('open'); render(); window.scrollTo(0, 0); return; }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case 'sugg': doAsk(t.dataset.q); break;
    case 'mem': ui.mem = t.dataset.k; render(); break;
    case 'approveM': { const r = B.approveMemory(S, id, ui.person); render(); toast(r?.followup ? `Approved. The brain proposed a follow-up for ${B.PEOPLE[r.followup.for].name.split(' ')[0]}; it waits in Actions.` : 'Approved: it can now answer questions.'); break; }
    case 'rejectM': B.rejectMemory(S, id, ui.person); render(); toast('Rejected: it will never be used in answers.'); break;
    case 'editA': ui.editing = ui.editing === id ? null : id; render(); break;
    case 'approveA': { const ta = document.getElementById('ed-' + id); B.approveAction(S, id, ui.person, ta ? ta.value : null); ui.editing = null; render(); toast('Approved by you: now in the outbox.'); break; }
    case 'discardA': B.discardAction(S, id, ui.person); render(); toast('Discarded. Nothing was sent.'); break;
    case 'close': $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden', 'true'); break;
    case 'live': if (B.triggerLive(S)) { render(); setTimeout(notify, 600); } break;
    case 'notifOpen': $('#notif').classList.remove('on'); ui.tab = 'brief'; render(); break;
    case 'notifClose': $('#notif').classList.remove('on'); break;
    case 'reset': $('#notif').classList.remove('on'); S = B.initialState(); ui = fresh(); $('#persona').value = 'sara'; render(); toast('Demo reset.'); break;
  }
});
document.addEventListener('submit', e => { if (e.target.id === 'askf') { e.preventDefault(); const v = $('#q').value; doAsk(v); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#drawer').classList.remove('open'); });
$('#persona').addEventListener('change', e => { ui.person = e.target.value; ui.editing = null; render(); if (ui.tab !== 'ask') window.scrollTo(0, 0); if (S.live) notify(); toast(`Now viewing as ${P().name}, ${P().title}`); });
$('#insp').addEventListener('change', render);
$('#ai').addEventListener('change', render);
render();
sample = { json: async (prompt) => { const r = await fetch('/api/phrase', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }) }); if (!r.ok) throw new Error('phrase failed'); return r.json(); } };
render();
}
</script>
</body>
</html>
